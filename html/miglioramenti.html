<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miglioramenti</title>
    <link rel="stylesheet" href="/css/miglioramenti.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<div id="header-container"></div>
<main class="content split-layout">
    <section class="left-panel">
        <h1 class="main-title">I Miei Miglioramenti</h1>
        <div class="grafico">
            <img src="../image/graficoGeneraleIUM.png" alt="Grafico Complessivo" class="graph-box" />
        </div>
    </section>

    <section class="right-panel">
        <br><br><br><br>
        <label for="data-inizio">Data Inizio:</label>
        <input type="date" id="data-inizio" required />

        <label for="data-fine">Data Fine:</label>
        <input type="date" id="data-fine" required />

        <button id="viewGraphButton" class="nav-btn btn-calcola" type="button">CALCOLA</button>
    </section>
</main>
<script src="/javascript/script.js"></script>
<div id="footer-container"></div>
<script>
    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer-container').innerHTML = data;
        });
</script>
<script>
    fetch('header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header-container').innerHTML = data;

            // Ora che il header è nel DOM, aggancio il listener al logout-link
            const logoutLink = document.getElementById('logout-link');
            if (logoutLink) {
                logoutLink.addEventListener('click', (event) => {
                    event.preventDefault();
                    Swal.fire({
                        title: 'Sei sicuro di voler uscire?',
                        text: 'La sessione verrà chiusa.',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: 'Sì, esci',
                        cancelButtonText: 'Annulla'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            sessionStorage.removeItem('loggedInUser');
                            Swal.fire({
                                icon: 'info',
                                title: 'Logout effettuato',
                                text: 'Sei stato disconnesso con successo.',
                                confirmButtonText: 'OK'
                            }).then(() => {
                                window.location.href = 'mainpage.html';
                            });
                        }
                    });
                });
            }
        });

</script>

</body>
</html>
