<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grafico Metriche</title>
    <link rel="stylesheet" href="/css/grafico_metriche.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div id="header-container"></div>

<main class="content grafico-metriche-layout">
    <div id="grafico" class="grafico-metriche-container">
        <!-- Il grafico verrà inserito via JavaScript -->
    </div>
    <button id="downloadBtn" class="nav-btn btn-download" style="display:none;">Scarica il Grafico</button>
</main>

<div id="footer-container"></div>
<script>
    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer-container').innerHTML = data;
        });
</script>
<script>
    fetch('header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header-container').innerHTML = data;

            // Ora che il header è nel DOM, aggancio il listener al logout-link
            const logoutLink = document.getElementById('logout-link');
            if (logoutLink) {
                logoutLink.addEventListener('click', (event) => {
                    event.preventDefault();
                    Swal.fire({
                        title: 'Sei sicuro di voler uscire?',
                        text: 'La sessione verrà chiusa.',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: 'Sì, esci',
                        cancelButtonText: 'Annulla'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            sessionStorage.removeItem('loggedInUser');
                            Swal.fire({
                                icon: 'info',
                                title: 'Logout effettuato',
                                text: 'Sei stato disconnesso con successo.',
                                confirmButtonText: 'OK'
                            }).then(() => {
                                window.location.href = 'mainpage.html';
                            });
                        }
                    });
                });
            }
        });

</script>
<script src="../javascript/script.js"></script>

</body>
</html>
